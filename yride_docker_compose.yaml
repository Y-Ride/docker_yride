# This file is used to define the services that will be run in the docker containers.

# Change sensor_hostname varaiables in the .env file to match the IP addresses of the sensors

# Ouster ROS driver instances (defined as an anchor)
x-ouster-ros: &ouster-ros  # <-- Define the anchor here
    build:
      context: ${HOME}/docker_yride/Other_drivers/ouster-ros
      dockerfile: Dockerfile
    image: ouster-ros
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - ros2

services:
  # Y-ride ROS2 workspace
  yride:
    build:
      context: ${HOME}/docker_yride/ros2_ws
      dockerfile: Dockerfile
    image: yride
    container_name: yride
    volumes:
      - ${HOME}/docker_yride/ros2_ws:${HOME}/docker_ros2_ws:rw
    stdin_open: true
    tty: true
    networks:
      - ros2

  # Using the ouster-ros service
  ouster-ros-top:
    <<: *ouster-ros
    container_name: ouster-ros-top
    command: record.launch.xml sensor_hostname:=${SENSOR_HOSTNAME_TOP} bag_file:=test1 viz:=false

  # ouster-ros-front:
  #   <<: *ouster-ros
  #   container_name: ouster-ros-front
  #   command: sensor_hostname:=${SENSOR_HOSTNAME_FRONT} viz:=false

  # ouster-ros-back:
  #   <<: *ouster-ros
  #   container_name: ouster-ros-back
  #   command: sensor_hostname:=${SENSOR_HOSTNAME_BACK} viz:=false

  # ouster-ros-left:
  #   <<: *ouster-ros
  #   container_name: ouster-ros-left
  #   command: sensor_hostname:=${SENSOR_HOSTNAME_LEFT} viz:=false

  # ouster-ros-right:
  #   <<: *ouster-ros
  #   container_name: ouster-ros-right
  #   command: sensor_hostname:=${SENSOR_HOSTNAME_RIGHT} viz:=false

networks:
  ros2:
    driver: bridge
