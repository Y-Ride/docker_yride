# This file is used to define the services that will be run in the docker containers.

# Change sensor_hostname varaiables in the .env file to match the IP addresses of the sensors

# Ouster ROS driver instances (defined as an anchor)
x-ouster-ros: &ouster-ros  # <-- Define the anchor here
    build:
      context: ${HOME}/docker_yride/Other_drivers/ouster-ros
      dockerfile: Dockerfile
    image: ouster-ros
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
    network_mode: host
    # ipc: host

services:
  # Y-ride ROS2 workspace
  yride:
    build:
      context: ${HOME}/docker_yride/ros2_ws
      dockerfile: Dockerfile
    image: yride
    container_name: yride
    volumes:
      - ${HOME}/docker_yride/ros2_ws:${HOME}/docker_ros2_ws:rw
      - /dev/shm:/dev/shm
    working_dir: ${HOME}/docker_ros2_ws
    stdin_open: true
    tty: true
    network_mode: host
    # ipc: host

  # Using the ouster-ros service
  ouster-ros-top:
    <<: *ouster-ros
    container_name: ouster-ros-top
    command: > # List parameters to be passed to the launch file
      ros2 launch ouster_ros
      sensor.launch.xml
      sensor_hostname:=${SENSOR_HOSTNAME_TOP}
      ouster_ns:=ouster_top
      viz:=false
      use_system_default_qos:=true
    # tail -f /dev/null
    

