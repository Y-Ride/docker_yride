services:
  # Y-ride ROS2 workspace
  yride_all_together:
    build:
      context: ${HOME}/docker_yride
      dockerfile: Dockerfile_ws
      args:
        UID: "${UID:-$(id -u)}"
        GID: "${GID:-$(id -g)}"
        UNAME: "docker"
    image: yride_all_together
    container_name: yride_all_together
    user: "${UID}:${GID}"
    volumes:
      - ${HOME}/docker_yride/ros2_ws:/docker_yride/yride_ros2_ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/docker_yride/ros2_ws/liosam_params.yaml:/docker_yride/other_drivers_ros2_ws/src/LIO-SAM/config/params.yaml:rw
    environment:
      DISPLAY: ${DISPLAY}    
      # set up sensor hostname IPv4 address
      SENSOR_HOSTNAME_TOP: ${SENSOR_HOSTNAME_TOP}
      SENSOR_HOSTNAME_FRONT: ${SENSOR_HOSTNAME_FRONT}
      SENSOR_HOSTNAME_RIGHT: ${SENSOR_HOSTNAME_RIGHT}
      SENSOR_HOSTNAME_LEFT: ${SENSOR_HOSTNAME_LEFT}
      SENSOR_HOSTNAME_BACK: ${SENSOR_HOSTNAME_BACK}
      ROS_DOMAIN_ID: 1
      LS_COLORS: 'di=1;34:fi=0:ln=1;36:pi=1;33:so=1;35:bd=1;33:cd=1;33:or=1;31:mi=1;31:ex=1;32'
    working_dir: /docker_yride/yride_ros2_ws
    stdin_open: true
    tty: true
    network_mode: host
    # ipc: host