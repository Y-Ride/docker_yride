services:
  # Y-ride ROS2 workspace
  yride_all_together:
    build:
      context: ..
      dockerfile: docker/dockerfile
    image: yride_all_together
    container_name: yride_all_together
    volumes:
      - ${HOME}/docker_yride/ros2_ws/src:/docker_yride/ros2_ws/src:rw
      - ${HOME}/data_byu/bags:/docker_yride/ros2_ws/bags:rw
      - ${HOME}/data_byu/maps:/docker_yride/ros2_ws/maps:rw
      - ${HOME}/docker_yride/ros2_ws/scripts:/docker_yride/ros2_ws/scripts:rw
      - /tmp/.X11-unix:/tmp/.X11-unix # Needed to display RViz within the container
      - ${HOME}/docker_yride/ros2_ws/src/liosam_params.yaml:/docker_yride/other_drivers_ros2_ws/src/LIO-SAM/config/params.yaml:rw
      - ${HOME}/yride_env_setup:/yride_env_setup:ro # Yride environment setup
    environment:
      DISPLAY: "${DISPLAY}" # Needed to display RViz within the container
      # set up sensor hostname IPv4 addresses
      LIDAR_IP_TOP: ${LIDAR_STATIC_IP_TOP}
      LIDAR_IP_LEFT: ${LIDAR_STATIC_IP_LEFT}
      LIDAR_IP_RIGHT: ${LIDAR_STATIC_IP_RIGHT}
      LIDAR_IP_FRONT: ${LIDAR_STATIC_IP_FRONT}
      LIDAR_IP_BACK: ${LIDAR_STATIC_IP_BACK}
      ROS_DOMAIN_ID: 1
      CONTAINER_NAME: yride_top
      RCUTILS_COLORIZED_OUTPUT: 1 # Allows launch files to print colored text
      XDG_RUNTIME_DIR: "/tmp/runtime-root" # For Rviz2
    devices:
      - "/dev/dri:/dev/dri" # For Rviz2
      - "/dev/ttyACM0:/dev/ttyACM0"
    working_dir: /docker_yride/ros2_ws
    stdin_open: true
    tty: true
    network_mode: host
